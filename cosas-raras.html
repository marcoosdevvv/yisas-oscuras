<style>
/* Cosas raras: una máquina expendedora encendida en una calle a oscuras. Es la única luz y alumbra el suelo. */
body{background:#030405;min-height:100svh}
.calle{position:relative;padding-top:92px;padding-bottom:140px;isolation:isolate}
.calle::before{content:"";position:absolute;z-index:-1;left:50%;top:60px;width:min(1400px,180vw);height:110%;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(214,255,226,.16),rgba(214,255,226,.05) 55%,transparent 75%);pointer-events:none}
.acera{position:absolute;z-index:-1;left:0;right:0;bottom:0;height:200px;background:#0a0c0d}
.acera::before{content:"";position:absolute;left:50%;top:0;width:min(900px,120vw);height:90px;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(214,255,226,.22),transparent);pointer-events:none}
.farola{position:absolute;z-index:-1;right:6%;top:120px;width:6px;height:70%;background:#0d0f10;border-radius:3px}
.farola::before{content:"";position:absolute;top:0;left:-30px;width:36px;height:10px;border-radius:5px;background:#0d0f10}
@media (max-width:820px){.farola{display:none}}
</style>
