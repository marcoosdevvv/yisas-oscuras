<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2248%22 fill=%22%23F0E424%22/%3E%3Ccircle cx=%2236%22 cy=%2240%22 r=%226%22/%3E%3Ccircle cx=%2264%22 cy=%2240%22 r=%226%22/%3E%3Cpath d=%22M30 60q20 22 40 0%22 stroke=%22black%22 stroke-width=%227%22 fill=%22none%22 stroke-linecap=%22round%22/%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jesús Villegas</title>
<meta name="description" content="Solo gente rara aquí. Los proyectos, descubrimientos y cosas raras de Yisas Villegas.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Schibsted+Grotesk:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="comun/base.css?v=1793653713">
<link rel="stylesheet" href="comun/noche.css?v=1793653713">
<style>
/* Portada: todo a oscuras. Tu dedo es una linterna infrarroja y donde alumbras aparecen sus secciones en verde. */
html,body{height:100%}
body{overflow:hidden}
.escena{--x:50%;--y:42%;--r:170px;position:fixed;inset:0;touch-action:none}
.verde{position:absolute;inset:0;background:var(--nv-fondo);color:var(--nv);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2.2vh,22px);padding:90px 20px 110px;text-align:center;transition:background-color .6s,color .6s}
.lema{margin:0;font-size:15px;font-weight:700;color:var(--nv)}
.foto{width:clamp(110px,20vh,190px);aspect-ratio:1;border-radius:50%;transition:filter .6s}
.links{display:flex;flex-direction:column;align-items:center;gap:clamp(2px,.6vh,6px)}
.links a{font-weight:900;letter-spacing:-.04em;line-height:1.02;font-size:clamp(30px,5.4vh,54px);color:var(--nv-claro);text-decoration:none;text-transform:lowercase;padding:0 8px;border-radius:8px;transition:color .2s,transform .2s var(--ease-out)}
.links a:active{transform:scale(.97)}
@media (hover:hover) and (pointer:fine){.links a:hover{color:#fff}}
.dominio{margin:0;font-size:13px;font-weight:600;color:var(--soft)}
.oscuro{position:absolute;inset:0;background:#000;pointer-events:none;-webkit-mask-image:radial-gradient(circle var(--r) at var(--x) var(--y),transparent 0,transparent 55%,rgba(0,0,0,.6) 78%,#000 100%);mask-image:radial-gradient(circle var(--r) at var(--x) var(--y),transparent 0,transparent 55%,rgba(0,0,0,.6) 78%,#000 100%);transition:opacity .6s}
.abajo{position:fixed;z-index:46;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 var(--gx)}
.pista{margin:0;font-size:13px;font-weight:700;color:var(--soft);transition:opacity .4s}
.tocado .pista{opacity:0}
.interruptor{display:inline-flex;align-items:center;gap:10px;border:0;border-radius:99px;padding:12px 18px 12px 12px;font-weight:800;font-size:15px;line-height:1;background:rgba(164,244,172,.12);color:var(--nv);transition:transform .16s var(--ease-out)}
.interruptor:active{transform:scale(.97)}
.interruptor i{width:34px;height:20px;border-radius:99px;background:#0a2a12;position:relative;transition:background-color .3s}
.interruptor i::after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:var(--nv);transition:transform .3s var(--ease-out)}
/* luz encendida: el plató sin misterio, todo a la vista */
.luz .oscuro{opacity:0}
.luz .verde{background:#EDECE7;color:#0B0B0B}
.luz .links a{color:#0B0B0B}
.luz .lema,.luz .dominio{color:#3d3c38}
.luz .grano,.luz .lineas-tv,.luz .hud{opacity:0}
.luz .interruptor{background:#0B0B0B;color:#fff}
.luz .interruptor i{background:#F0E424}
.luz .interruptor i::after{transform:translateX(14px);background:#0B0B0B}
.luz{--top-fg:#0B0B0B;--menu-bg:rgba(0,0,0,.07);--menu-fg:#0B0B0B}
.luz .pista{opacity:0}
.grano,.lineas-tv,.hud{transition:opacity .5s}
</style>
</head>
<body>
<div class="grano" aria-hidden="true"></div>
<div class="lineas-tv" aria-hidden="true"></div>
<header class="top" style="z-index:47"><span class="home">yisasvillegas</span><a class="menu-btn" href="index.html" data-menu>menú ≡</a></header>
<div class="hud" aria-hidden="true"><span class="rec">REC</span><span><span id="tc">00:00:00:00</span> · IR</span></div>
<main class="escena" id="escena">
  <div class="verde">
    <img class="foto" src="comun/img/yisas.webp" alt="Jesús Villegas">
    <nav class="links" id="links" aria-label="Secciones"></nav>
    <p class="dominio">yisasvillegas.com</p>
  </div>
  <div class="oscuro" aria-hidden="true"></div>
</main>
<div class="abajo">
  <p class="pista">mueve el dedo para alumbrar</p>
  <button class="interruptor" id="interruptor" type="button" aria-pressed="false"><i aria-hidden="true"></i><span>encender la luz</span></button>
</div>
<script src="comun/datos.js?v=1793653713"></script>
<script src="comun/ui.js?v=1793653713"></script>
<script>
(function(){
  var Y=window.YISAS, reduce=YUI.reduce;
  document.getElementById('links').innerHTML=Y.secciones.map(function(s){
    return '<a href="'+s.href+'"'+(s.fuera?' target="_blank" rel="noopener"':'')+'>'+YUI.esc(s.texto)+(s.fuera?' ↗':'')+'</a>';
  }).join('');

  var esc=document.getElementById('escena'), tc=document.getElementById('tc'), manual=0, t0=performance.now(), raf=0, lx=0, ly=0;
  var R=window.innerWidth<600?150:220;
  esc.style.setProperty('--r',R+'px');
  function set(x,y){ lx=x; ly=y; esc.style.setProperty('--x',x.toFixed(1)+'px'); esc.style.setProperty('--y',y.toFixed(1)+'px'); }
  function sigue(e){ set(e.clientX,e.clientY); manual=performance.now()+3500; document.body.classList.add('tocado'); }
  esc.addEventListener('pointermove',sigue);
  esc.addEventListener('pointerdown',sigue);
  // con teclado: la linterna va al enlace que tiene el foco
  document.getElementById('links').addEventListener('focusin',function(e){
    var r=e.target.getBoundingClientRect(); set(r.left+r.width/2,r.top+r.height/2); manual=performance.now()+6000;
  });

  // si nadie toca, la linterna busca sola por la habitación
  function frame(t){
    raf=requestAnimationFrame(frame);
    if(t>manual && !reduce){
      var w=innerWidth, h=innerHeight, k=(t-t0)/1000;
      var ax=w<700?.28:Math.min(.2,260/w);
      var tx=w*(.5+ax*Math.sin(k*.55)), ty=h*(.5+.24*Math.sin(k*.83+1.1));
      set(lx+(tx-lx)*.06, ly+(ty-ly)*.06);
    }
    var s=(t-t0)/1000;
    tc.textContent='00:'+YUI.pad(Math.floor(s/60)%60)+':'+YUI.pad(Math.floor(s)%60)+':'+YUI.pad(Math.floor((s%1)*25));
  }
  set(innerWidth/2,innerHeight*.42);
  raf=requestAnimationFrame(frame);

  var sw=document.getElementById('interruptor');
  sw.addEventListener('click',function(){
    var on=document.body.classList.toggle('luz');
    sw.setAttribute('aria-pressed',on?'true':'false');
    sw.querySelector('span').textContent=on?'apagar la luz':'encender la luz';
  });
  window.addEventListener('resize',function(){ R=window.innerWidth<600?150:220; esc.style.setProperty('--r',R+'px'); });
})();
</script>
</body>
</html>
